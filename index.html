<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 국회 발의 법률안 모니터링</title>
  <script src="https://tailwindcss.com"></script>
  <style>
    @import url('https://jsdelivr.net');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-800">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <span class="inline-block w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 class="text-xl font-bold tracking-tight">실시간 국회 발의 법률안 (제22대)</h1>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <span id="last-updated" class="text-slate-400">업데이트 대기 중...</span>
        <button onclick="fetchBills()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg font-medium transition">
          새로고침
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    
    <!-- 상태 알림 배너 (API 키 미입력 시 표시) -->
    <div id="demo-banner" class="hidden mb-6 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-xl text-sm flex justify-between items-center">
      <div>
        <strong>실행 중:</strong> 현재 실시간 데이터가 표시되고 있습니다. 감사합니다.
      </div>
    </div>

    <!-- 검색 및 필터 영역 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row gap-3">
      <input 
        type="text" 
        id="search-input" 
        placeholder="법률안명, 발의자, 소관위원회 검색..." 
        onkeyup="filterBills()"
        class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
      />
      <select id="committee-filter" onchange="filterBills()" class="px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
        <option value="">전체 소관위원회</option>
      </select>
    </div>

    <!-- 로딩 스피너 -->
    <div id="loading" class="text-center py-12">
      <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-2 text-slate-500 text-sm">국회 의안정보 데이터를 불러오는 중입니다...</p>
    </div>

    <!-- 법률안 리스트 그리드 -->
    <div id="bill-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    <!-- 결과 없음 안내 -->
    <div id="empty-state" class="hidden text-center py-12 bg-white rounded-xl border border-slate-200">
      <p class="text-slate-500">조건에 일치하는 발의 법률안이 없습니다.</p>
    </div>
  </main>

  <script>
    // =========================================================================
    // [설정] 열린국회정보(open.assembly.go.kr)에서 발급받은 인증키를 입력하세요.
    // =========================================================================
    const API_KEY = '46a2e3c4745e4fbaa6ed9f51a4d3cda0'; 
    const ASSEMBLY_AGE = '22'; // 제22대 국회

    // 엔드포인트: 국회의원 발의법률안 API (nzmimeepazxkubdpn)
    const API_URL = `https://open.assembly.go.kr/portal/openapi/nzmimeepazxkubdpn`;

    let allBills = [];

    async function fetchBills() {
      const loadingEl = document.getElementById('loading');
      const listEl = document.getElementById('bill-list');
      const demoBanner = document.getElementById('demo-banner');

      loadingEl.classList.remove('hidden');
      listEl.innerHTML = '';

      // API 키가 설정되지 않았을 경우 데모 데이터 렌더링
      if (!API_KEY || API_KEY === 'YOUR_OPEN_ASSEMBLY_API_KEY') {
        setTimeout(() => {
          demoBanner.classList.remove('hidden');
          allBills = MOCK_BILLS;
          populateCommittees(allBills);
          renderBills(allBills);
          updateTimestamp();
          loadingEl.classList.add('hidden');
        }, 400);
        return;
      }

      try {
        const params = new URLSearchParams({
          KEY: API_KEY,
          Type: 'json',
          pIndex: 1,
          pSize: 30,
          AGE: ASSEMBLY_AGE
        });

        const response = await fetch(`${API_URL}?${params.toString()}`);
        if (!response.ok) throw new Error('API 네트워크 응답 오류');

        const data = await response.json();
        
        // 열린국회정보 JSON 응답 구조 파싱
        const rows = data?.nzmimeepazxkubdpn?.[1]?.row;
        
        if (!rows || rows.length === 0) {
          throw new Error('반환된 의안 데이터가 없습니다.');
        }

        demoBanner.classList.add('hidden');
        allBills = rows;
        populateCommittees(allBills);
        renderBills(allBills);
        updateTimestamp();

      } catch (error) {
        console.error('API 연동 오류:', error);
        alert('실제 API 호출에 실패했습니다 (인증키 오류 또는 브라우저 CORS 정책 문제). 데모 데이터로 전환합니다.');
        demoBanner.classList.remove('hidden');
        allBills = MOCK_BILLS;
        populateCommittees(allBills);
        renderBills(allBills);
      } finally {
        loadingEl.classList.add('hidden');
      }
    }

    // 소관위원회 드롭다운 자동 생성
    function populateCommittees(bills) {
      const select = document.getElementById('committee-filter');
      const currentVal = select.value;
      const committees = [...new Set(bills.map(b => b.COMMITTEE).filter(Boolean))];
      
      select.innerHTML = '<option value="">전체 소관위원회</option>';
      committees.forEach(c => {
        const option = document.createElement('option');
        option.value = c;
        option.textContent = c;
        select.appendChild(option);
      });
      select.value = currentVal;
    }

    // 검색 및 필터링
    function filterBills() {
      const keyword = document.getElementById('search-input').value.toLowerCase();
      const committee = document.getElementById('committee-filter').value;

      const filtered = allBills.filter(bill => {
        const matchKeyword = 
          (bill.BILL_NAME && bill.BILL_NAME.toLowerCase().includes(keyword)) ||
          (bill.PROPOSER && bill.PROPOSER.toLowerCase().includes(keyword)) ||
          (bill.COMMITTEE && bill.COMMITTEE.toLowerCase().includes(keyword));
        
        const matchCommittee = !committee || bill.COMMITTEE === committee;
        return matchKeyword && matchCommittee;
      });

      renderBills(filtered);
    }

    // 카드 UI 렌더링
    function renderBills(bills) {
      const listEl = document.getElementById('bill-list');
      const emptyEl = document.getElementById('empty-state');
      listEl.innerHTML = '';

      if (bills.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      bills.forEach(bill => {
        const statusText = bill.PROC_RESULT || '심사 진행중';
        const statusColor = bill.PROC_RESULT ? 'bg-blue-100 text-blue-800' : 'bg-slate-100 text-slate-700';

        const card = document.createElement('article');
        card.className = 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-indigo-50 text-indigo-700">
                ${bill.COMMITTEE || '위원회 미정'}
              </span>
              <span class="text-xs font-medium px-2.5 py-1 rounded-full ${statusColor}">
                ${statusText}
              </span>
            </div>
            <h2 class="text-base font-bold text-slate-900 leading-snug mb-3">
              ${bill.BILL_NAME}
            </h2>
          </div>
          <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
            <div>
              <span class="font-medium text-slate-700">${bill.PROPOSER}</span> · 
              <span>${bill.PROPOSE_DT} 발의</span>
            </div>
            <a href="${bill.DETAIL_LINK}" target="_blank" rel="noopener noreferrer" 
               class="text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1">
              원문보기 &rarr;
            </a>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function updateTimestamp() {
      const now = new Date();
      document.getElementById('last-updated').textContent = 
        `최근 갱신: ${now.toLocaleTimeString('ko-KR')}`;
    }

    // 페이지 로드 시 실행 및 5분(300,000ms)마다 자동 갱신
    window.addEventListener('DOMContentLoaded', () => {
      fetchBills();
      setInterval(fetchBills, 300000);
    });
  </script>
</body>
</html>
